[build-system]
requires = ["maturin>=1.13,<2.0"]
build-backend = "maturin"

[project]
name = "odin_palace_py"
description = "Python bindings for odin_palace 1C bank statement parser"
requires-python = ">=3.10"
dependencies = []
license = "MIT"
readme = "README.md"
authors = [
    { name = "Tochka" },
]
keywords = ["1c", "bank", "statement", "parser", "1CClientBankExchange"]
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Financial :: Accounting",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/tochka-public/odin_palace_py"
Repository = "https://github.com/tochka-public/odin_palace_py"
Issues = "https://github.com/tochka-public/odin_palace_py/issues"

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "python"

[dependency-groups]
dev = [
    "maturin>=1.13,<2.0",
    "mypy>=1.19",
    "pytest>=9.0",
    "ruff>=0.15",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
files = ["python", "tests", "benchmarks"]

[[tool.mypy.overrides]]
# tests/ — без __init__.py, поэтому модуль называется test_*
module = ["tests.*", "test_parse"]
# тестам разрешён нетипизированный код — сигнатуры хуков и хелперов
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_any_generics = false
disable_error_code = ["comparison-overlap"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # конфликтуют с ruff format
    "COM812",
    "ISC001",
    # длина строки — на усмотрение форматтера
    "E501",
    # докстринги не обязательны для каждого файла/класса/__init__
    "D100",
    "D101",
    "D104",
    "D107",
    "D415",
]

[tool.ruff.lint.per-file-ignores]
"benchmarks/**/*.py" = [
    "D103",
    "T201",
    "INP001",
    "RUF001",
    "RUF002",
    "RUF003",
]
"tests/**/*.py" = [
    "S101",
    "S301",
    "S311",
    "D",
    "ANN",
    "ARG001",  # хуки обязаны принимать все аргументы сигнатуры
    "A004",    # SyntaxError импортируется намеренно (публичный API)
    "EM101",
    "EM102",
    "TRY003",
    "INP001",
    "PLR0911",
    "PLR2004",
    "RUF001",
    "RUF002",
    "RUF003",
]
"**/__init__.py" = [
    "D104",
    "A004",  # реэкспорт SyntaxError — часть публичного API
]
"**/*.pyi" = [
    "A001",    # класс SyntaxError — часть публичного API
    "PYI021",  # докстринги в stub оставлены намеренно (подсказки в IDE)
    "PYI048",
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pydocstyle]
convention = "google"
