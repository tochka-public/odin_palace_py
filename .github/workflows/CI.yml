name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check (fmt, clippy, ruff, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Rust toolchain
        run: rustup show

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Rust fmt
        run: cargo fmt --check

      - name: Rust clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Rust tests
        run: cargo test

      - name: Python lint (ruff)
        run: |
          uv sync --group dev
          uv run ruff check .
          uv run ruff format --check .

      - name: Build extension (dev)
        run: |
          uv run maturin develop

      - name: Python tests (pytest)
        run: uv run pytest tests/ -v

  # Validate that wheels and the sdist build on every change. Releases are
  # cut by release-please.yml, which reuses the same workflow and publishes.
  wheels:
    needs: [check]
    uses: ./.github/workflows/wheels.yml
