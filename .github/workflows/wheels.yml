name: wheels

# Reusable wheel/sdist build. Called by CI.yml (validation) and
# release-please.yml (release). Artifacts are uploaded as `wheels-*` and are
# available to subsequent jobs of the calling workflow run.
#
# Target interpreter set: CPython 3.10–3.14 + free-threaded 3.14t.
#
# One hard constraint shapes the layout:
#  - setup-python (macOS/Windows) conflates X.Y and X.Yt on one runner — the
#    free-threaded build clobbers the regular one. So regular and 3.14t live in
#    SEPARATE jobs, one interpreter family per runner. On Linux the manylinux
#    images ship cp314t, so --find-interpreter covers it in the same job.
#    `--find-interpreter` over-collects (cp315 pre-release, experimental
#    cp313t, PyPy), so a filter step drops what we do not publish.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        platform:
          # Current PyPA manylinux images ship the free-threaded cp314t build,
          # so --find-interpreter discovers it everywhere; the old pinned
          # rust-cross image (whose cross linker recently broke) is gone.
          - target: x86_64
            container: auto
            manylinux: "2_28"
            interpreters: --find-interpreter
          - target: aarch64
            container: auto
            manylinux: "2_28"
            interpreters: --find-interpreter
          - target: ppc64le
            container: auto
            manylinux: "2_28"
            interpreters: --find-interpreter
          - target: s390x
            container: auto
            manylinux: "2_28"
            interpreters: --find-interpreter
          - target: armv7
            container: auto
            manylinux: auto
            interpreters: --find-interpreter
          - target: x86
            container: auto
            manylinux: auto
            interpreters: --find-interpreter
    steps:
      - uses: actions/checkout@v6
      # Wheels are release artifacts: build against the published core from
      # crates.io, exactly like an end user installing the sdist would.
      - name: Strip local-dev [patch.crates-io] from Cargo.toml
        shell: bash
        run: |
          sed -i.bak '/^\[patch\.crates-io\]$/,$d' Cargo.toml && rm -f Cargo.toml.bak
          ! grep -q 'patch.crates-io' Cargo.toml
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist ${{ matrix.platform.interpreters }}
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          manylinux: ${{ matrix.platform.manylinux }}
          container: ${{ matrix.platform.container }}
      - name: Drop unpublished interpreters (cp315 pre-release, experimental cp313t)
        run: rm -f dist/*cp315* dist/*cp313t*
      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-linux-${{ matrix.platform.target }}
          path: dist

  musllinux:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        platform:
          - target: x86_64
          - target: x86
          - target: aarch64
          - target: armv7
    steps:
      - uses: actions/checkout@v6
      # Wheels are release artifacts: build against the published core from
      # crates.io, exactly like an end user installing the sdist would.
      - name: Strip local-dev [patch.crates-io] from Cargo.toml
        shell: bash
        run: |
          sed -i.bak '/^\[patch\.crates-io\]$/,$d' Cargo.toml && rm -f Cargo.toml.bak
          ! grep -q 'patch.crates-io' Cargo.toml
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          manylinux: musllinux_1_2
      - name: Drop unpublished interpreters (cp315 pre-release, experimental cp313t)
        run: rm -f dist/*cp315* dist/*cp313t*
      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-musllinux-${{ matrix.platform.target }}
          path: dist

  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x64, x86]
    steps:
      - uses: actions/checkout@v6
      # Wheels are release artifacts: build against the published core from
      # crates.io, exactly like an end user installing the sdist would.
      - name: Strip local-dev [patch.crates-io] from Cargo.toml
        shell: bash
        run: |
          sed -i.bak '/^\[patch\.crates-io\]$/,$d' Cargo.toml && rm -f Cargo.toml.bak
          ! grep -q 'patch.crates-io' Cargo.toml
      - uses: actions/setup-python@v6
        with:
          python-version: |
            3.10
            3.11
            3.12
            3.13
            3.14
          architecture: ${{ matrix.target }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --find-interpreter
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-windows-${{ matrix.target }}
          path: dist

  windows-freethreaded:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      # Wheels are release artifacts: build against the published core from
      # crates.io, exactly like an end user installing the sdist would.
      - name: Strip local-dev [patch.crates-io] from Cargo.toml
        shell: bash
        run: |
          sed -i.bak '/^\[patch\.crates-io\]$/,$d' Cargo.toml && rm -f Cargo.toml.bak
          ! grep -q 'patch.crates-io' Cargo.toml
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14t"
          architecture: x64
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: x64
          args: --release --out dist --find-interpreter
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      # find-interpreter also builds the runner's preinstalled regular CPythons,
      # whose filenames collide with the regular job's artifacts and corrupt
      # them on merge ("ZIP Trailing data"). Keep only the free-threaded wheel.
      - name: Keep only free-threaded wheels
        shell: bash
        run: find dist -name '*.whl' ! -name '*cp314t*' -delete
      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-windows-ft-x64
          path: dist

  macos:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: macos-15-intel
            target: x86_64
          - runner: macos-latest
            target: aarch64
    steps:
      - uses: actions/checkout@v6
      # Wheels are release artifacts: build against the published core from
      # crates.io, exactly like an end user installing the sdist would.
      - name: Strip local-dev [patch.crates-io] from Cargo.toml
        shell: bash
        run: |
          sed -i.bak '/^\[patch\.crates-io\]$/,$d' Cargo.toml && rm -f Cargo.toml.bak
          ! grep -q 'patch.crates-io' Cargo.toml
      - uses: actions/setup-python@v6
        with:
          python-version: |
            3.10
            3.11
            3.12
            3.13
            3.14
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-macos-${{ matrix.platform.target }}
          path: dist

  macos-freethreaded:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: macos-15-intel
            target: x86_64
          - runner: macos-latest
            target: aarch64
    steps:
      - uses: actions/checkout@v6
      # Wheels are release artifacts: build against the published core from
      # crates.io, exactly like an end user installing the sdist would.
      - name: Strip local-dev [patch.crates-io] from Cargo.toml
        shell: bash
        run: |
          sed -i.bak '/^\[patch\.crates-io\]$/,$d' Cargo.toml && rm -f Cargo.toml.bak
          ! grep -q 'patch.crates-io' Cargo.toml
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14t"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      # find-interpreter also builds the runner's preinstalled regular CPythons,
      # whose filenames collide with the regular job's artifacts and corrupt
      # them on merge ("ZIP Trailing data"). Keep only the free-threaded wheel.
      - name: Keep only free-threaded wheels
        shell: bash
        run: find dist -name '*.whl' ! -name '*cp314t*' -delete
      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-macos-ft-${{ matrix.platform.target }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # The sdist must be installable by end users who do not have a local
      # odin_palace checkout, so the dev-only [patch.crates-io] section is
      # stripped and the sdist resolves the core from crates.io.
      - name: Strip local-dev [patch.crates-io] from Cargo.toml
        shell: bash
        run: |
          sed -i.bak '/^\[patch\.crates-io\]$/,$d' Cargo.toml && rm -f Cargo.toml.bak
          ! grep -q 'patch.crates-io' Cargo.toml
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@v6
        with:
          name: wheels-sdist
          path: dist
