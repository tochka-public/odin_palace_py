name: wheels

# Reusable wheel/sdist build. Called by CI.yml (validation) and
# release-please.yml (release). Artifacts are uploaded as `wheels-*` and are
# available to subsequent jobs of the calling workflow run.
#
# Target interpreter set: CPython 3.10–3.14 + free-threaded 3.14t.
#
# - macOS/Windows: setup-python installs exactly the wanted interpreters.
#   Regular and free-threaded go in SEPARATE steps — listing e.g. `3.14` and
#   `3.14t` together makes setup-python dedupe by major.minor and the
#   free-threaded build wins, dropping the regular one.
# - Linux/musllinux: build in a manylinux/musllinux container and discover
#   interpreters with `--find-interpreter`. The images ship extras (cp315
#   pre-release, experimental cp313t, PyPy), so a filter step drops the ones
#   we do not publish. cp314t requires manylinux_2_28 (manylinux2014 has no
#   free-threaded build); armv7/x86 have no 2_28 image → regular wheels only.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: ubuntu-22.04
            target: x86_64
            manylinux: "2_28"
          - runner: ubuntu-22.04
            target: aarch64
            manylinux: "2_28"
          - runner: ubuntu-22.04
            target: ppc64le
            manylinux: "2_28"
          - runner: ubuntu-22.04
            target: s390x
            manylinux: "2_28"
          - runner: ubuntu-22.04
            target: armv7
            manylinux: auto
          - runner: ubuntu-22.04
            target: x86
            manylinux: auto
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          manylinux: ${{ matrix.platform.manylinux }}
      - name: Drop unpublished interpreters (cp315 pre-release, experimental cp313t)
        run: rm -f dist/*cp315* dist/*cp313t*
      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-linux-${{ matrix.platform.target }}
          path: dist

  musllinux:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: ubuntu-22.04
            target: x86_64
          - runner: ubuntu-22.04
            target: x86
          - runner: ubuntu-22.04
            target: aarch64
          - runner: ubuntu-22.04
            target: armv7
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          manylinux: musllinux_1_2
      - name: Drop unpublished interpreters (cp315 pre-release, experimental cp313t)
        run: rm -f dist/*cp315* dist/*cp313t*
      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-musllinux-${{ matrix.platform.target }}
          path: dist

  windows:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: windows-latest
            target: x64
            freethreaded: true
          - runner: windows-latest
            target: x86
            freethreaded: false
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: |
            3.10
            3.11
            3.12
            3.13
            3.14
          architecture: ${{ matrix.platform.target }}
      - uses: actions/setup-python@v6
        if: ${{ matrix.platform.freethreaded }}
        with:
          python-version: "3.14t"
          architecture: ${{ matrix.platform.target }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-windows-${{ matrix.platform.target }}
          path: dist

  macos:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: macos-15-intel
            target: x86_64
          - runner: macos-latest
            target: aarch64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: |
            3.10
            3.11
            3.12
            3.13
            3.14
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14t"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-macos-${{ matrix.platform.target }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@v6
        with:
          name: wheels-sdist
          path: dist
